name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: moat_dev_password
          POSTGRES_DB: moat_mcp
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/sql:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd "pg_isready -U postgres -d moat_mcp >/dev/null && psql -U postgres -d moat_mcp -tAc 'SELECT count(*) FROM film' | grep -q 1000"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Smoke test (build + MCP stdio query tool)
        run: npm run test:smoke
        env:
          DATABASE_URL: postgres://mcp_readonly:moat_readonly_dev@127.0.0.1:5432/moat_mcp

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: moat_dev_password
          POSTGRES_DB: moat_mcp
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/sql:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd "pg_isready -U postgres -d moat_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      # The postgres service container boots before checkout, so the bind-mounted
      # sql/ dir is empty when initdb.d runs and the schema never loads. Load it
      # explicitly after checkout via docker exec (files are bind-mounted live).
      - name: Load schema + data + roles + RLS into postgres
        run: |
          docker exec postgres psql -U postgres -d moat_mcp -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/pagila-schema.sql
          docker exec postgres psql -U postgres -d moat_mcp -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/pagila-data.sql
          docker exec postgres psql -U postgres -d moat_mcp -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/99-readonly-role.sql
          docker exec postgres psql -U postgres -d moat_mcp -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/99-rls-policies.sql

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Smoke test (build + MCP stdio query tool)
        run: npm run test:smoke
        env:
          DATABASE_URL: postgres://mcp_readonly:moat_readonly_dev@127.0.0.1:5432/moat_mcp

      - name: OAuth 2.1 + JWT smoke (full auth flow over HTTP)
        run: npm run test:smoke:oauth
        env:
          DATABASE_URL: postgres://mcp_readonly:moat_readonly_dev@127.0.0.1:5432/moat_mcp
